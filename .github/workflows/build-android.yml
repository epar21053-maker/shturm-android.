name: Build Shturm Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Shturm_Android.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check uploaded project archive
        run: |
          test -f Shturm_Android.zip || { echo "::error::Shturm_Android.zip was not found in repository root"; exit 1; }
          mkdir -p project
          unzip -q Shturm_Android.zip -d project
          echo "Archive contents:"
          find project -maxdepth 4 -type f | sort | head -200

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          SETTINGS="$(find project -type f \\( -name settings.gradle -o -name settings.gradle.kts \\) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle/settings.gradle.kts found. The uploaded ZIP may not contain the Android Studio project."
            exit 1
          fi
          ROOT="$(dirname "$SETTINGS")"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Android project root: $ROOT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "Gradle wrapper not found; using Gradle 8.7."
            sudo apt-get update
            sudo apt-get install -y gradle
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shturm-Android-APK
          path: |
            ${{ steps.locate.outputs.root }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
