name: Build Shturm Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Shturm_Android.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          test -f Shturm_Android.zip || { echo "::error::Shturm_Android.zip not found in repository root"; exit 1; }
          mkdir project
          unzip -q Shturm_Android.zip -d project
          echo "Archive contents:"
          find project -maxdepth 4 -type f | sort | head -200
          SETTINGS="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.gradle/*' -print -quit)"
          test -n "$SETTINGS" || { echo "::error::No Android Gradle project found in ZIP"; exit 1; }
          echo "PROJECT_ROOT=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Configure Android SDK
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "Using Android SDK at: $SDK_ROOT"
          test -x "$SDKMANAGER" || { echo "::error::sdkmanager missing at $SDKMANAGER"; find /usr/local/lib/android -type f -name sdkmanager -print || true; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shturm-Android-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
